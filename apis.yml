name: Hatch Loyalty
description: >-
  Hatch Loyalty (formerly Belly) was a Chicago-based customer activation, loyalty,
  and engagement platform for enterprise retailers, with a strong focus on the fuel
  and convenience-store vertical. It aggregated customer data across a retailer's
  business systems to build customer profiles and ran a rules engine over submitted
  transactions to trigger offers and redemptions. Hatch exposed a RESTful developer
  platform (the "Hatch HUB" API) that conformed to the JSON:API specification, with
  a public developer portal, API reference, and transaction-processing tutorials.
  The company was backed by Andreessen Horowitz (a16z), Lightbank, NEA, and DAG
  Ventures, and was acquired by Stuzo around 2019-2020 (the earlier Belly product
  line was sold to Mobivity). As of this profile the hatchloyalty.com domain and
  all of its subdomains (www, developer, api) are parked and listed for sale, so no
  live API or developer surface remains to enrich.
